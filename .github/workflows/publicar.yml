name: Publicar en Instagram

on:
  schedule:
    - cron: '30 11 * * *'   # 10:00 hora Argentina
    - cron: '0 16 * * *'    # 13:00 hora Argentina
    - cron: '30 23 * * *'   # 20:30 hora Argentina
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Solo probar (no publica)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency: publicar

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publicar la próxima
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          BASE_URL: ${{ vars.BASE_URL }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && '1' || '0' }}
        run: python publicar.py
      - name: Guardar lo publicado
        run: |
          git config user.name "IC Publicador"
          git config user.email "bot@users.noreply.github.com"
          git add publicado.json
          git diff --cached --quiet || (git commit -m "Publicado en Instagram" && git push)
